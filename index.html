<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#eef3ff">

<title>ШОК ЦЕНА — Учёт</title>

<style>
:root{
  --blue:#007aff;
  --blue2:#4c8dff;
  --violet:#8257ff;
  --pink:#ff4fa3;
  --cyan:#4ee8ff;

  --text:#111318;
  --muted:#7a7f8d;

  --glass:rgba(255,255,255,.62);
  --glass2:rgba(255,255,255,.78);

  --line:rgba(255,255,255,.72);
  --dark-line:rgba(30,35,50,.09);

  --shadow:
    0 18px 50px rgba(33,46,85,.12),
    0 4px 15px rgba(33,46,85,.07);

  --r-xl:30px;
  --r-lg:22px;
  --r-md:16px;
  --r-sm:13px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Helvetica Neue",
    Arial,
    sans-serif;

  color:var(--text);
  background:#edf2fb;

  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}

body{
  position:fixed;
  inset:0;
}

button,
input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
  touch-action:manipulation;
}

input{
  min-width:0;
}

/* =========================================================
   LIVE BACKGROUND
========================================================= */

.background{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;

  background:
    linear-gradient(
      145deg,
      #eef4ff 0%,
      #f7f4ff 47%,
      #edf8ff 100%
    );
}

.background::after{
  content:"";

  position:absolute;
  inset:0;

  opacity:.22;

  background-image:
    linear-gradient(
      rgba(255,255,255,.65) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(255,255,255,.65) 1px,
      transparent 1px
    );

  background-size:42px 42px;

  mask-image:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.45),
      transparent 75%
    );
}

.orb{
  position:absolute;

  width:380px;
  height:380px;

  border-radius:50%;

  filter:blur(45px);

  opacity:.34;

  will-change:transform;
}

.orb.one{
  top:-150px;
  left:-110px;

  background:
    radial-gradient(
      circle,
      #5ca3ff,
      transparent 68%
    );

  animation:
    floatOne 14s ease-in-out infinite alternate;
}

.orb.two{
  top:18%;
  right:-180px;

  background:
    radial-gradient(
      circle,
      #a875ff,
      transparent 68%
    );

  animation:
    floatTwo 17s ease-in-out infinite alternate;
}

.orb.three{
  bottom:-180px;
  left:15%;

  background:
    radial-gradient(
      circle,
      #55e0ff,
      transparent 68%
    );

  animation:
    floatThree 20s ease-in-out infinite alternate;
}

.orb.four{
  width:270px;
  height:270px;

  bottom:10%;
  right:10%;

  background:
    radial-gradient(
      circle,
      #ff78bc,
      transparent 68%
    );

  opacity:.20;

  animation:
    floatFour 16s ease-in-out infinite alternate;
}

@keyframes floatOne{
  from{
    transform:
      translate3d(0,0,0)
      scale(1);
  }

  to{
    transform:
      translate3d(90px,100px,0)
      scale(1.15);
  }
}

@keyframes floatTwo{
  from{
    transform:
      translate3d(0,0,0)
      scale(1);
  }

  to{
    transform:
      translate3d(-120px,60px,0)
      scale(1.18);
  }
}

@keyframes floatThree{
  from{
    transform:
      translate3d(0,0,0);
  }

  to{
    transform:
      translate3d(120px,-80px,0);
  }
}

@keyframes floatFour{
  from{
    transform:
      translate3d(0,0,0)
      scale(.9);
  }

  to{
    transform:
      translate3d(-90px,-100px,0)
      scale(1.15);
  }
}

/* =========================================================
   APP
========================================================= */

.app{
  position:absolute;
  inset:0;

  display:flex;
  flex-direction:column;

  overflow:hidden;
}

/* =========================================================
   HEADER
========================================================= */

.topbar{
  flex:none;

  padding:
    calc(10px + env(safe-area-inset-top))
    12px
    10px;

  z-index:30;
}

.header-glass{
  display:flex;
  align-items:center;
  gap:9px;

  min-height:64px;

  padding:8px 9px 8px 14px;

  border:
    1px solid rgba(255,255,255,.78);

  border-radius:24px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.78),
      rgba(255,255,255,.49)
    );

  -webkit-backdrop-filter:
    blur(24px)
    saturate(165%);

  backdrop-filter:
    blur(24px)
    saturate(165%);

  box-shadow:
    0 12px 35px rgba(50,65,100,.12),
    inset 0 1px 0 rgba(255,255,255,.95);
}

.brand{
  flex:1;
  min-width:0;
}

.brand-top{
  display:flex;
  align-items:center;
  gap:7px;

  margin-bottom:2px;
}

.brand-dot{
  width:9px;
  height:9px;

  border-radius:50%;

  background:
    linear-gradient(
      135deg,
      var(--blue),
      var(--violet)
    );

  box-shadow:
    0 0 0 5px rgba(0,122,255,.08);
}

.brand-small{
  color:#737989;

  font-size:11px;
  font-weight:750;
  letter-spacing:.8px;
}

.brand-title{
  font-size:22px;
  line-height:1.1;

  font-weight:850;

  letter-spacing:-.55px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.header-button{
  flex:none;

  height:46px;

  padding:0 13px;

  border:
    1px solid rgba(255,255,255,.86);

  border-radius:15px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.93),
      rgba(255,255,255,.71)
    );

  color:#20232b;

  font-size:14px;
  font-weight:780;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,1),
    0 3px 12px rgba(40,50,80,.08);
}

.header-button:active{
  transform:scale(.96);
}

.header-button.primary{
  color:white;

  border-color:rgba(20,22,28,.9);

  background:
    linear-gradient(
      135deg,
      #16181f,
      #2c303b
    );

  box-shadow:
    0 7px 18px rgba(20,25,40,.20),
    inset 0 1px 0 rgba(255,255,255,.15);
}

/* =========================================================
   SCROLLER
========================================================= */

.scroll-area{
  flex:1;

  overflow-y:auto;
  overflow-x:hidden;

  -webkit-overflow-scrolling:touch;

  overscroll-behavior-y:contain;
  touch-action:pan-y;

  padding:
    1px
    12px
    calc(28px + env(safe-area-inset-bottom));
}

body.keyboard-open .scroll-area{
  padding-bottom:355px;
}

/* =========================================================
   DASHBOARD
========================================================= */

.dashboard{
  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:8px;

  margin-bottom:13px;
}

.stat{
  position:relative;

  overflow:hidden;

  padding:12px;

  min-height:76px;

  border:
    1px solid rgba(255,255,255,.78);

  border-radius:20px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.76),
      rgba(255,255,255,.48)
    );

  -webkit-backdrop-filter:
    blur(20px)
    saturate(150%);

  backdrop-filter:
    blur(20px)
    saturate(150%);

  box-shadow:
    0 8px 25px rgba(40,55,90,.07),
    inset 0 1px 0 rgba(255,255,255,.95);
}

.stat::after{
  content:"";

  position:absolute;

  width:80px;
  height:80px;

  right:-30px;
  top:-30px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(80,135,255,.22),
      transparent 70%
    );
}

.stat:nth-child(2)::after{
  background:
    radial-gradient(
      circle,
      rgba(150,90,255,.19),
      transparent 70%
    );
}

.stat:nth-child(3)::after{
  background:
    radial-gradient(
      circle,
      rgba(60,205,255,.22),
      transparent 70%
    );
}

.stat-label{
  position:relative;
  z-index:2;

  color:var(--muted);

  font-size:11px;
  font-weight:740;

  margin-bottom:7px;
}

.stat-value{
  position:relative;
  z-index:2;

  font-size:24px;
  font-weight:850;

  letter-spacing:-.8px;
}

/* =========================================================
   GROUP
========================================================= */

.group{
  position:relative;

  overflow:hidden;

  margin-bottom:14px;

  border:
    1px solid rgba(255,255,255,.80);

  border-radius:28px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.76),
      rgba(255,255,255,.53)
    );

  -webkit-backdrop-filter:
    blur(22px)
    saturate(145%);

  backdrop-filter:
    blur(22px)
    saturate(145%);

  box-shadow:
    0 15px 42px rgba(38,52,90,.10),
    inset 0 1px 0 rgba(255,255,255,.95);
}

.group::before{
  content:"";

  position:absolute;
  inset:0 0 auto 0;

  height:90px;

  pointer-events:none;

  background:
    linear-gradient(
      120deg,
      rgba(84,145,255,.10),
      rgba(150,90,255,.06),
      transparent
    );
}

.group-header{
  position:relative;
  z-index:2;

  display:flex;
  gap:9px;
  align-items:flex-end;

  padding:12px;

  border-bottom:
    1px solid rgba(40,45,60,.07);
}

.group-title-area{
  flex:1;
  min-width:0;
}

.group-label{
  margin:0 0 5px 4px;

  color:#818694;

  font-size:10px;
  font-weight:800;

  letter-spacing:1px;
}

.group-name{
  width:100%;
  height:52px;

  padding:0 14px;

  border:
    1px solid rgba(255,255,255,.90);

  border-radius:16px;

  outline:none;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.93),
      rgba(255,255,255,.72)
    );

  color:#14161c;

  font-size:20px;
  font-weight:820;

  letter-spacing:-.3px;

  box-shadow:
    inset 0 1px 0 #fff,
    0 4px 14px rgba(40,50,80,.06);
}

.group-name.active-cell{
  border-color:
    rgba(0,122,255,.65);

  box-shadow:
    0 0 0 4px rgba(0,122,255,.12),
    inset 0 1px 0 white,
    0 7px 20px rgba(0,122,255,.08);
}

.delete-group{
  flex:none;

  width:52px;
  height:52px;

  border-radius:16px;

  color:#ff3b30;

  background:
    rgba(255,70,60,.10);

  border:
    1px solid rgba(255,255,255,.72);

  font-size:23px;
  font-weight:700;
}

/* =========================================================
   GROUP MINI STATS
========================================================= */

.group-meta{
  position:relative;
  z-index:2;

  display:flex;
  gap:7px;

  padding:8px 10px;

  border-bottom:
    1px solid rgba(40,45,60,.07);
}

.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;

  height:28px;

  padding:0 10px;

  border-radius:999px;

  color:#626775;

  background:
    rgba(255,255,255,.69);

  border:
    1px solid rgba(255,255,255,.85);

  font-size:11px;
  font-weight:760;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.95);
}

.pill-dot{
  width:6px;
  height:6px;

  border-radius:50%;

  background:var(--blue);
}

/* =========================================================
   TABLE
========================================================= */

.table-head,
.item-row{
  display:grid;

  grid-template-columns:
    36px
    minmax(0,1fr)
    minmax(0,.86fr)
    44px;

  align-items:center;
}

.table-head{
  position:relative;
  z-index:2;

  min-height:42px;

  color:#868b97;

  font-size:11px;
  font-weight:790;

  border-bottom:
    1px solid rgba(40,45,60,.07);
}

.table-head div{
  padding:0 4px;
  text-align:center;
}

.item-row{
  position:relative;

  min-height:67px;

  border-bottom:
    1px solid rgba(35,40,55,.065);
}

.item-row:last-child{
  border-bottom:0;
}

.item-row::after{
  content:"";

  position:absolute;

  left:48px;
  right:55px;
  bottom:0;

  height:1px;

  opacity:.32;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(100,110,140,.30),
      transparent
    );
}

.row-index{
  text-align:center;

  color:#a1a5af;

  font-size:12px;
  font-weight:760;
}

.cell{
  width:calc(100% - 8px);
  height:52px;

  margin:7px 4px;

  padding:0 8px;

  outline:none;

  border:
    1px solid rgba(255,255,255,.9);

  border-radius:15px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.89),
      rgba(255,255,255,.66)
    );

  color:#15171c;

  text-align:center;

  font-size:22px;
  font-weight:820;

  box-shadow:
    inset 0 1px 0 white,
    0 3px 11px rgba(35,45,70,.055);
}

.cell::placeholder{
  color:#c4c6ce;
}

.cell.active-cell{
  border-color:
    rgba(0,122,255,.65);

  background:white;

  box-shadow:
    0 0 0 4px rgba(0,122,255,.11),
    0 8px 20px rgba(0,122,255,.10),
    inset 0 1px 0 white;
}

.delete-item{
  width:38px;
  height:38px;

  margin:auto;

  border-radius:12px;

  background:
    rgba(255,59,48,.085);

  color:#ff3b30;

  font-size:19px;
  font-weight:800;
}

/* =========================================================
   ADD BUTTON
========================================================= */

.add-area{
  padding:9px;
}

.add-row{
  width:100%;
  height:52px;

  border-radius:16px;

  color:#087cff;

  border:
    1px solid rgba(255,255,255,.82);

  background:
    linear-gradient(
      145deg,
      rgba(232,243,255,.91),
      rgba(241,248,255,.73)
    );

  font-size:15px;
  font-weight:810;

  box-shadow:
    inset 0 1px 0 white,
    0 3px 11px rgba(0,122,255,.06);
}

.add-row:active{
  transform:scale(.985);
}

/* =========================================================
   KEYBOARD
========================================================= */

.keyboard{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  z-index:100;

  padding:
    9px
    9px
    calc(9px + env(safe-area-inset-bottom));

  background:
    linear-gradient(
      180deg,
      rgba(215,219,229,.82),
      rgba(196,201,213,.88)
    );

  border-top:
    1px solid rgba(255,255,255,.86);

  -webkit-backdrop-filter:
    blur(25px)
    saturate(160%);

  backdrop-filter:
    blur(25px)
    saturate(160%);

  box-shadow:
    0 -20px 55px rgba(25,35,60,.17),
    inset 0 1px 0 rgba(255,255,255,.82);

  transform:translateY(110%);

  transition:
    transform .18s
    cubic-bezier(.2,.85,.2,1);

  will-change:transform;
}

.keyboard.show{
  transform:translateY(0);
}

/* =========================================================
   KEYBOARD TOOLBAR
========================================================= */

.keyboard-toolbar{
  display:grid;

  grid-template-columns:
    60px
    minmax(66px,1fr)
    54px
    54px
    minmax(72px,1fr);

  gap:7px;

  margin-bottom:8px;
}

.tool{
  height:47px;

  padding:0 7px;

  border-radius:14px;

  border:
    1px solid rgba(255,255,255,.78);

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.93),
      rgba(255,255,255,.77)
    );

  color:#17191f;

  font-size:14px;
  font-weight:810;

  box-shadow:
    inset 0 1px 0 white,
    0 2px 5px rgba(25,30,45,.10);
}

.tool:active{
  transform:scale(.95);
  background:#c4c6cc;
}

.arrow{
  font-size:26px;
}

.arrow.forward{
  color:white;

  border-color:
    rgba(20,22,27,.85);

  background:
    linear-gradient(
      135deg,
      #15171d,
      #2e323d
    );
}

.done{
  color:white;

  border-color:#087cff;

  background:
    linear-gradient(
      135deg,
      #1386ff,
      #006fe8
    );

  box-shadow:
    0 6px 14px rgba(0,122,255,.22),
    inset 0 1px 0 rgba(255,255,255,.25);
}

/* =========================================================
   NUMPAD
========================================================= */

.numpad{
  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:7px;
}

.key{
  height:59px;

  border-radius:14px;

  border:
    1px solid rgba(255,255,255,.80);

  color:#111318;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.96),
      rgba(255,255,255,.82)
    );

  font-size:28px;
  font-weight:650;

  box-shadow:
    inset 0 1px 0 white,
    0 2px 4px rgba(25,30,45,.13);
}

.key:active{
  transform:scale(.96);
  background:#c0c2c9;
}

.key.secondary{
  font-size:16px;
  font-weight:800;

  background:
    linear-gradient(
      180deg,
      rgba(183,187,196,.96),
      rgba(168,172,183,.96)
    );
}

/* =========================================================
   LETTERS
========================================================= */

.letters{
  display:none;
}

.letter-row{
  display:flex;

  gap:4px;

  margin-bottom:6px;
}

.letter{
  flex:1;
  min-width:0;

  height:49px;

  padding:0;

  border-radius:10px;

  border:
    1px solid rgba(255,255,255,.76);

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.94),
      rgba(255,255,255,.80)
    );

  color:#17181d;

  font-size:16px;
  font-weight:690;

  box-shadow:
    inset 0 1px 0 white,
    0 2px 4px rgba(25,30,45,.12);
}

.letter:active{
  transform:scale(.95);
  background:#c0c2c8;
}

.letter.space{
  flex:4;
}

.letter.wide{
  flex:1.5;

  background:
    rgba(177,181,191,.90);
}

/* =========================================================
   TOAST
========================================================= */

.toast{
  position:absolute;

  z-index:200;

  left:50%;
  bottom:20px;

  max-width:
    calc(100% - 30px);

  padding:11px 17px;

  border:
    1px solid rgba(255,255,255,.16);

  border-radius:999px;

  color:white;

  background:
    rgba(20,22,29,.90);

  -webkit-backdrop-filter:blur(15px);
  backdrop-filter:blur(15px);

  font-size:13px;
  font-weight:760;

  box-shadow:
    0 8px 24px rgba(0,0,0,.18);

  opacity:0;

  transform:
    translate(-50%,30px)
    scale(.94);

  pointer-events:none;

  transition:.2s ease;
}

.toast.show{
  opacity:1;

  transform:
    translate(-50%,0)
    scale(1);
}

body.keyboard-open .toast{
  bottom:335px;
}

/* =========================================================
   LANDSCAPE
========================================================= */

@media (orientation:landscape){

  .scroll-area{
    padding-left:18px;
    padding-right:18px;
  }

  .dashboard,
  #groupsContainer{
    max-width:900px;

    margin-left:auto;
    margin-right:auto;
  }

  body.keyboard-open .scroll-area{
    padding-bottom:300px;
  }

  .keyboard{
    width:650px;

    left:50%;
    right:auto;

    border-radius:25px 25px 0 0;

    transform:
      translate(-50%,110%);
  }

  .keyboard.show{
    transform:
      translate(-50%,0);
  }

  .key{
    height:48px;
  }

  .letter{
    height:42px;
  }

  body.keyboard-open .toast{
    bottom:285px;
  }
}

/* =========================================================
   PERFORMANCE / ACCESSIBILITY
========================================================= */

@media (prefers-reduced-motion:reduce){

  .orb{
    animation:none;
  }

  *{
    transition:none !important;
  }
}
</style>
</head>

<body>

<div class="background">

  <div class="orb one"></div>
  <div class="orb two"></div>
  <div class="orb three"></div>
  <div class="orb four"></div>

</div>

<div class="app">

  <header class="topbar">

    <div class="header-glass">

      <div class="brand">

        <div class="brand-top">

          <div class="brand-dot"></div>

          <div class="brand-small">
            ШОК ЦЕНА
          </div>

        </div>

        <div class="brand-title">
          Учёт товаров
        </div>

      </div>


      <button
        class="header-button"
        onclick="exportCSV()">
        Экспорт
      </button>


      <button
        class="header-button primary"
        onclick="addGroup(true)">
        + Группа
      </button>

    </div>

  </header>


  <main
    id="scrollArea"
    class="scroll-area">


    <section class="dashboard">

      <div class="stat">

        <div class="stat-label">
          ГРУППЫ
        </div>

        <div
          id="groupCount"
          class="stat-value">
          0
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          ПОЗИЦИИ
        </div>

        <div
          id="positionCount"
          class="stat-value">
          0
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          ВСЕГО ШТУК
        </div>

        <div
          id="qtyCount"
          class="stat-value">
          0
        </div>

      </div>

    </section>


    <div id="groupsContainer"></div>

  </main>


  <section
    id="keyboard"
    class="keyboard">


    <div class="keyboard-toolbar">

      <button
        id="modeButton"
        class="tool"
        onclick="toggleMode()">
        АБВ
      </button>


      <button
        class="tool"
        onclick="goNext()">
        Далее
      </button>


      <button
        class="tool arrow"
        onclick="goPrev()">
        ←
      </button>


      <button
        class="tool arrow forward"
        onclick="goNext()">
        →
      </button>


      <button
        class="tool done"
        onclick="hideKeyboard()">
        Готово
      </button>

    </div>


    <div
      id="numpad"
      class="numpad">

      <button class="key" onclick="typeKey('1')">1</button>
      <button class="key" onclick="typeKey('2')">2</button>
      <button class="key" onclick="typeKey('3')">3</button>

      <button class="key" onclick="typeKey('4')">4</button>
      <button class="key" onclick="typeKey('5')">5</button>
      <button class="key" onclick="typeKey('6')">6</button>

      <button class="key" onclick="typeKey('7')">7</button>
      <button class="key" onclick="typeKey('8')">8</button>
      <button class="key" onclick="typeKey('9')">9</button>

      <button
        class="key secondary"
        onclick="backspace()">
        ⌫
      </button>

      <button
        class="key"
        onclick="typeKey('0')">
        0
      </button>

      <button
        class="key secondary"
        onclick="clearInput()">
        Очистить
      </button>

    </div>


    <div
      id="letters"
      class="letters">


      <div class="letter-row">

        <button class="letter" onclick="typeKey('й')">Й</button>
        <button class="letter" onclick="typeKey('ц')">Ц</button>
        <button class="letter" onclick="typeKey('у')">У</button>
        <button class="letter" onclick="typeKey('к')">К</button>
        <button class="letter" onclick="typeKey('е')">Е</button>
        <button class="letter" onclick="typeKey('н')">Н</button>
        <button class="letter" onclick="typeKey('г')">Г</button>
        <button class="letter" onclick="typeKey('ш')">Ш</button>
        <button class="letter" onclick="typeKey('щ')">Щ</button>
        <button class="letter" onclick="typeKey('з')">З</button>

      </div>


      <div class="letter-row">

        <button class="letter" onclick="typeKey('ф')">Ф</button>
        <button class="letter" onclick="typeKey('ы')">Ы</button>
        <button class="letter" onclick="typeKey('в')">В</button>
        <button class="letter" onclick="typeKey('а')">А</button>
        <button class="letter" onclick="typeKey('п')">П</button>
        <button class="letter" onclick="typeKey('р')">Р</button>
        <button class="letter" onclick="typeKey('о')">О</button>
        <button class="letter" onclick="typeKey('л')">Л</button>
        <button class="letter" onclick="typeKey('д')">Д</button>
        <button class="letter" onclick="typeKey('ж')">Ж</button>

      </div>


      <div class="letter-row">

        <button class="letter" onclick="typeKey('я')">Я</button>
        <button class="letter" onclick="typeKey('ч')">Ч</button>
        <button class="letter" onclick="typeKey('с')">С</button>
        <button class="letter" onclick="typeKey('м')">М</button>
        <button class="letter" onclick="typeKey('и')">И</button>
        <button class="letter" onclick="typeKey('т')">Т</button>
        <button class="letter" onclick="typeKey('ь')">Ь</button>
        <button class="letter" onclick="typeKey('б')">Б</button>
        <button class="letter" onclick="typeKey('ю')">Ю</button>

        <button
          class="letter wide"
          onclick="backspace()">
          ⌫
        </button>

      </div>


      <div class="letter-row">

        <button
          class="letter wide"
          onclick="clearInput()">
          C
        </button>

        <button
          class="letter"
          onclick="typeKey('-')">
          -
        </button>

        <button
          class="letter space"
          onclick="typeKey(' ')">
          пробел
        </button>

      </div>

    </div>

  </section>


  <div
    id="toast"
    class="toast">
  </div>

</div>


<script>
const STORAGE_KEY =
  "shock_price_inventory_glass_v5";


let groups = [];

let activeInput = null;

let keyboardMode =
  "number";

let toastTimer = null;


const groupsContainer =
  document.getElementById(
    "groupsContainer"
  );

const keyboard =
  document.getElementById(
    "keyboard"
  );

const numpad =
  document.getElementById(
    "numpad"
  );

const letters =
  document.getElementById(
    "letters"
  );

const modeButton =
  document.getElementById(
    "modeButton"
  );

const scrollArea =
  document.getElementById(
    "scrollArea"
  );

const toast =
  document.getElementById(
    "toast"
  );


/* =========================================================
   LOAD
========================================================= */

function load(){

  try{

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );


    if(saved){

      const parsed =
        JSON.parse(saved);


      if(Array.isArray(parsed)){

        groups =
          parsed;

      }

    }

  }catch(error){}


  if(groups.length === 0){

    groups = [

      {
        name:"Нижнее бельё",

        items:[
          {
            price:"",
            qty:""
          }
        ]
      }

    ];

  }


  normalize();

  render();

}


/* =========================================================
   NORMALIZE
========================================================= */

function normalize(){

  groups =
    groups.map(group => {

      return {

        name:
          String(
            group.name || ""
          ),

        items:
          Array.isArray(
            group.items
          )
          ?
          group.items.map(
            item => {

              return {

                price:
                  String(
                    item.price || ""
                  ),

                qty:
                  String(
                    item.qty || ""
                  )

              };

            }
          )
          :
          []

      };

    });


  groups.forEach(
    group => {

      if(
        group.items.length === 0
      ){

        group.items.push({

          price:"",
          qty:""

        });

      }

    }
  );

}


/* =========================================================
   SAVE
========================================================= */

function save(){

  try{

    localStorage.setItem(

      STORAGE_KEY,

      JSON.stringify(
        groups
      )

    );

  }catch(error){

    showToast(
      "Ошибка сохранения"
    );

  }

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  groupsContainer.innerHTML =
    "";


  groups.forEach(
    (group,groupIndex) => {


      let groupPositions = 0;

      let groupQty = 0;


      group.items.forEach(
        item => {

          if(
            item.price !== "" ||
            item.qty !== ""
          ){

            groupPositions++;

          }


          groupQty +=
            parseInt(
              item.qty,
              10
            ) || 0;

        }
      );


      const section =
        document.createElement(
          "section"
        );


      section.className =
        "group";


      section.innerHTML = `

        <div class="group-header">

          <div class="group-title-area">

            <div class="group-label">
              ГРУППА ТОВАРОВ
            </div>

            <input
              class="group-name"

              readonly

              value="${escapeHTML(group.name)}"

              placeholder="Название группы"

              data-kind="group"

              data-group="${groupIndex}"
            >

          </div>


          <button
            class="delete-group"

            onclick="
              deleteGroup(
                ${groupIndex}
              )
            ">
            ×
          </button>

        </div>


        <div class="group-meta">

          <div class="pill">

            <span class="pill-dot"></span>

            Цен:
            ${groupPositions}

          </div>


          <div class="pill">

            <span class="pill-dot"></span>

            Штук:
            ${groupQty}

          </div>

        </div>


        <div class="table-head">

          <div>№</div>

          <div>
            ЦЕНА ₽
          </div>

          <div>
            КОЛ-ВО
          </div>

          <div></div>

        </div>


        <div
          id="items-${groupIndex}">
        </div>


        <div class="add-area">

          <button
            class="add-row"

            onclick="
              addItem(
                ${groupIndex},
                true
              )
            ">
            ＋ Добавить ещё цену
          </button>

        </div>

      `;


      groupsContainer.appendChild(
        section
      );


      const itemContainer =
        document.getElementById(
          `items-${groupIndex}`
        );


      group.items.forEach(
        (item,itemIndex) => {

          const row =
            document.createElement(
              "div"
            );


          row.className =
            "item-row";


          row.innerHTML = `

            <div class="row-index">

              ${itemIndex + 1}

            </div>


            <input
              class="cell"

              readonly

              value="${escapeHTML(item.price)}"

              placeholder="1299"

              data-kind="item"

              data-field="price"

              data-group="${groupIndex}"

              data-item="${itemIndex}"
            >


            <input
              class="cell"

              readonly

              value="${escapeHTML(item.qty)}"

              placeholder="5"

              data-kind="item"

              data-field="qty"

              data-group="${groupIndex}"

              data-item="${itemIndex}"
            >


            <button
              class="delete-item"

              onclick="
                deleteItem(
                  ${groupIndex},
                  ${itemIndex}
                )
              ">
              ×
            </button>

          `;


          itemContainer.appendChild(
            row
          );

        }
      );

    }
  );


  bindInputs();

  updateStats();

}


/* =========================================================
   BIND
========================================================= */

function bindInputs(){

  document
    .querySelectorAll(
      ".group-name,.cell"
    )
    .forEach(
      input => {

        input.addEventListener(
          "pointerdown",
          event => {

            event.preventDefault();

            activateInput(
              input
            );

          }
        );

      }
    );

}


/* =========================================================
   ACTIVATE
========================================================= */

function activateInput(input){

  clearActive();


  activeInput =
    input;


  input.classList.add(
    "active-cell"
  );


  if(
    input.dataset.kind ===
    "group"
  ){

    setMode(
      "letters"
    );

  }else{

    setMode(
      "number"
    );

  }


  showKeyboard();


  requestAnimationFrame(
    () => {

      keepVisible(
        input
      );

    }
  );

}


/* =========================================================
   ACTIVE STYLE
========================================================= */

function clearActive(){

  document
    .querySelectorAll(
      ".active-cell"
    )
    .forEach(
      el => {

        el.classList.remove(
          "active-cell"
        );

      }
    );

}


/* =========================================================
   KEYBOARD
========================================================= */

function showKeyboard(){

  keyboard.classList.add(
    "show"
  );

  document.body
    .classList
    .add(
      "keyboard-open"
    );

}


function hideKeyboard(){

  keyboard.classList.remove(
    "show"
  );

  document.body
    .classList
    .remove(
      "keyboard-open"
    );

  clearActive();

  activeInput = null;

}


/* =========================================================
   KEYBOARD MODE
========================================================= */

function toggleMode(){

  setMode(

    keyboardMode ===
    "number"

    ? "letters"

    : "number"

  );

}


function setMode(mode){

  keyboardMode =
    mode;


  if(
    mode === "letters"
  ){

    numpad.style.display =
      "none";

    letters.style.display =
      "block";

    modeButton.textContent =
      "123";

  }else{

    numpad.style.display =
      "grid";

    letters.style.display =
      "none";

    modeButton.textContent =
      "АБВ";

  }

}


/* =========================================================
   INPUT
========================================================= */

function typeKey(value){

  if(!activeInput){
    return;
  }


  activeInput.value +=
    value;


  updateValue();

}


function backspace(){

  if(!activeInput){
    return;
  }


  activeInput.value =
    activeInput.value.slice(
      0,
      -1
    );


  updateValue();

}


function clearInput(){

  if(!activeInput){
    return;
  }


  activeInput.value =
    "";


  updateValue();

}


/* =========================================================
   UPDATE
========================================================= */

function updateValue(){

  if(!activeInput){
    return;
  }


  const groupIndex =
    Number(
      activeInput.dataset.group
    );


  if(
    activeInput.dataset.kind ===
    "group"
  ){

    groups[groupIndex].name =
      activeInput.value;

  }else{

    const itemIndex =
      Number(
        activeInput.dataset.item
      );


    const field =
      activeInput.dataset.field;


    groups[groupIndex]
      .items[itemIndex][field] =
        activeInput.value;

  }


  save();

  updateStats();

}


/* =========================================================
   NEXT
========================================================= */

function goNext(){

  if(!activeInput){
    return;
  }


  const groupIndex =
    Number(
      activeInput.dataset.group
    );


  if(
    activeInput.dataset.kind ===
    "group"
  ){

    const target =
      findItem(
        groupIndex,
        0,
        "price"
      );


    if(target){

      activateInput(
        target
      );

    }

    return;

  }


  const itemIndex =
    Number(
      activeInput.dataset.item
    );


  const field =
    activeInput.dataset.field;


  if(
    field === "price"
  ){

    const target =
      findItem(
        groupIndex,
        itemIndex,
        "qty"
      );


    if(target){

      activateInput(
        target
      );

    }

    return;

  }


  if(
    field === "qty"
  ){

    const last =
      itemIndex ===
      groups[groupIndex]
        .items.length - 1;


    if(last){

      groups[groupIndex]
        .items.push({

          price:"",
          qty:""

        });


      save();

      const newIndex =
        itemIndex + 1;


      render();


      requestAnimationFrame(
        () => {

          const target =
            findItem(
              groupIndex,
              newIndex,
              "price"
            );


          if(target){

            activateInput(
              target
            );

          }

        }
      );


      return;

    }


    const target =
      findItem(
        groupIndex,
        itemIndex + 1,
        "price"
      );


    if(target){

      activateInput(
        target
      );

    }

  }

}


/* =========================================================
   PREVIOUS
========================================================= */

function goPrev(){

  if(!activeInput){
    return;
  }


  const groupIndex =
    Number(
      activeInput.dataset.group
    );


  if(
    activeInput.dataset.kind ===
    "group"
  ){

    return;

  }


  const itemIndex =
    Number(
      activeInput.dataset.item
    );


  const field =
    activeInput.dataset.field;


  if(
    field === "qty"
  ){

    const target =
      findItem(
        groupIndex,
        itemIndex,
        "price"
      );


    if(target){

      activateInput(
        target
      );

    }

    return;

  }


  if(
    field === "price"
  ){

    if(
      itemIndex > 0
    ){

      const target =
        findItem(
          groupIndex,
          itemIndex - 1,
          "qty"
        );


      if(target){

        activateInput(
          target
        );

      }

      return;

    }


    const groupInput =
      document.querySelector(

        `.group-name[
          data-group="${groupIndex}"
        ]`

      );


    if(groupInput){

      activateInput(
        groupInput
      );

    }

  }

}


/* =========================================================
   FIND
========================================================= */

function findItem(
  groupIndex,
  itemIndex,
  field
){

  return document.querySelector(

    `.cell[
      data-group="${groupIndex}"
    ][
      data-item="${itemIndex}"
    ][
      data-field="${field}"
    ]`

  );

}


/* =========================================================
   ADD GROUP
========================================================= */

function addGroup(focus){

  groups.push({

    name:"",

    items:[
      {
        price:"",
        qty:""
      }
    ]

  });


  save();

  render();


  if(!focus){
    return;
  }


  const index =
    groups.length - 1;


  requestAnimationFrame(
    () => {

      const target =
        document.querySelector(

          `.group-name[
            data-group="${index}"
          ]`

        );


      if(target){

        activateInput(
          target
        );

      }

    }
  );

}


/* =========================================================
   DELETE GROUP
========================================================= */

function deleteGroup(
  groupIndex
){

  const title =
    groups[groupIndex]
      .name
      .trim() ||
    "эту группу";


  const yes =
    confirm(
      `Удалить «${title}»?`
    );


  if(!yes){
    return;
  }


  groups.splice(
    groupIndex,
    1
  );


  if(
    groups.length === 0
  ){

    groups.push({

      name:"",

      items:[
        {
          price:"",
          qty:""
        }
      ]

    });

  }


  save();

  render();

  hideKeyboard();

}


/* =========================================================
   ADD ITEM
========================================================= */

function addItem(
  groupIndex,
  focus
){

  groups[groupIndex]
    .items
    .push({

      price:"",
      qty:""

    });


  const index =
    groups[groupIndex]
      .items.length - 1;


  save();

  render();


  if(!focus){
    return;
  }


  requestAnimationFrame(
    () => {

      const target =
        findItem(
          groupIndex,
          index,
          "price"
        );


      if(target){

        activateInput(
          target
        );

      }

    }
  );

}


/* =========================================================
   DELETE ITEM
========================================================= */

function deleteItem(
  groupIndex,
  itemIndex
){

  const items =
    groups[groupIndex]
      .items;


  if(
    items.length === 1
  ){

    items[0] = {

      price:"",
      qty:""

    };

  }else{

    items.splice(
      itemIndex,
      1
    );

  }


  save();

  render();

}


/* =========================================================
   STATS
========================================================= */

function updateStats(){

  let positions = 0;

  let quantity = 0;


  groups.forEach(
    group => {

      group.items.forEach(
        item => {

          if(
            item.price !== "" ||
            item.qty !== ""
          ){

            positions++;

          }


          quantity +=
            parseInt(
              item.qty,
              10
            ) || 0;

        }
      );

    }
  );


  document.getElementById(
    "groupCount"
  ).textContent =
    groups.length;


  document.getElementById(
    "positionCount"
  ).textContent =
    positions;


  document.getElementById(
    "qtyCount"
  ).textContent =
    quantity;

}


/* =========================================================
   KEEP VISIBLE
========================================================= */

function keepVisible(
  element
){

  const rect =
    element.getBoundingClientRect();


  const keyboardHeight =
    keyboard
      .classList
      .contains("show")

    ? keyboard
        .getBoundingClientRect()
        .height

    : 0;


  const bottomLimit =
    window.innerHeight -
    keyboardHeight -
    18;


  if(
    rect.bottom >
    bottomLimit
  ){

    scrollArea.scrollBy({

      top:
        rect.bottom -
        bottomLimit +
        18,

      behavior:"smooth"

    });

  }


  if(
    rect.top < 95
  ){

    scrollArea.scrollBy({

      top:
        rect.top -
        105,

      behavior:"smooth"

    });

  }

}


/* =========================================================
   EXPORT
========================================================= */

function exportCSV(){

  let csv =
    "\uFEFFГруппа;Цена;Количество\n";


  let hasData =
    false;


  groups.forEach(
    group => {

      group.items.forEach(
        item => {

          if(
            !group.name &&
            !item.price &&
            !item.qty
          ){

            return;

          }


          hasData =
            true;


          csv +=

            `"${csvEscape(group.name)}";` +

            `"${csvEscape(item.price)}";` +

            `"${csvEscape(item.qty)}"\n`;

        }
      );

    }
  );


  if(!hasData){

    showToast(
      "Нет данных"
    );

    return;

  }


  const blob =
    new Blob(

      [csv],

      {
        type:
          "text/csv;charset=utf-8"
      }

    );


  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement(
      "a"
    );


  link.href =
    url;


  link.download =
    "ШОК-ЦЕНА-учет.csv";


  document.body
    .appendChild(
      link
    );


  link.click();

  link.remove();


  setTimeout(
    () => {

      URL.revokeObjectURL(
        url
      );

    },
    1000
  );


  showToast(
    "Файл экспортирован"
  );

}


/* =========================================================
   TOAST
========================================================= */

function showToast(
  message
){

  clearTimeout(
    toastTimer
  );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      1700
    );

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  );

}


function csvEscape(
  value
){

  return String(
    value ?? ""
  )
  .replaceAll(
    '"',
    '""'
  );

}


/* =========================================================
   STOP SIDEWAYS DRAG
========================================================= */

let startX = 0;
let startY = 0;


document.addEventListener(
  "touchstart",
  event => {

    if(
      event.touches.length !==
      1
    ){
      return;
    }


    startX =
      event.touches[0]
        .clientX;


    startY =
      event.touches[0]
        .clientY;

  },
  {
    passive:true
  }
);


document.addEventListener(
  "touchmove",
  event => {

    if(
      event.touches.length !==
      1
    ){
      return;
    }


    const dx =
      Math.abs(

        event.touches[0]
          .clientX -
        startX

      );


    const dy =
      Math.abs(

        event.touches[0]
          .clientY -
        startY

      );


    if(
      dx > dy &&
      dx > 12
    ){

      event.preventDefault();

    }

  },
  {
    passive:false
  }
);


load();
</script>

</body>
</html>
